name: Sync Private Profile

on:
  push:
    branches:
      - master
    paths:
      - profile/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Mirror profile/ Into .github-private
    runs-on: ${{ vars.RUNNER_TYPE || 'self-hosted' }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Generate GitHub App Token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github-private

      - name: Read The App's User
        id: user
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout The Public Profile
        uses: actions/checkout@v7
        with:
          path: public

      - name: Checkout The Private Profile
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github-private
          token: ${{ steps.token.outputs.token }}
          path: private

      - name: Copy profile/ Across And Push Any Difference
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.user.outputs.id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rm -rf private/profile
          cp -r public/profile private/profile

          cd private
          git add --all profile

          if git diff --cached --quiet; then
            echo "profile/ already matches ${GITHUB_REPOSITORY}@${SOURCE_SHA:0:7}, so there is nothing to commit."
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "[Actions] Sync: profile/ from ${GITHUB_REPOSITORY}@${SOURCE_SHA:0:7}"
          git push

          echo "profile/ now matches ${GITHUB_REPOSITORY}@${SOURCE_SHA:0:7}"
